id: io.github.xander_haj.Z3RLauncher
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: z3r-launcher

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network
  env:
    CARGO_HOME: /run/build/z3r-launcher/cargo-home
    CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

modules:
  - name: z3r-launcher
    buildsystem: simple
    build-commands:
      - cargo build --release --locked --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/z3r-launcher /app/bin/z3r-launcher
      - install -Dm644 README.md /app/share/doc/Z3RLauncher/README.md
      - >-
        install -Dm644 packaging/flatpak/io.github.xander_haj.Z3RLauncher.desktop
        /app/share/applications/io.github.xander_haj.Z3RLauncher.desktop
      - >-
        install -Dm644 packaging/flatpak/io.github.xander_haj.Z3RLauncher.metainfo.xml
        /app/share/metainfo/io.github.xander_haj.Z3RLauncher.metainfo.xml
      - >-
        install -Dm644 src-tauri/icons/32x32.png
        /app/share/icons/hicolor/32x32/apps/io.github.xander_haj.Z3RLauncher.png
      - >-
        install -Dm644 src-tauri/icons/128x128.png
        /app/share/icons/hicolor/128x128/apps/io.github.xander_haj.Z3RLauncher.png
      - >-
        install -Dm644 src-tauri/icons/128x128@2x.png
        /app/share/icons/hicolor/256x256/apps/io.github.xander_haj.Z3RLauncher.png
    sources:
      - type: dir
        path: ../..
