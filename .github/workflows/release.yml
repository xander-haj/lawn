name: Build Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view --repo "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --draft \
              --title "Z3R Launcher ${GITHUB_REF_NAME}" \
              --notes "Download the launcher for your operating system below."

  build-tauri:
    needs: create-release
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-2022
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git submodule update --init --recursive

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [ -n "${{ matrix.rust_targets }}" ]; then
            rustup target add ${{ matrix.rust_targets }}
          fi

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version 2.6.2 --locked

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Prepare bundled Windows toolkit
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: ./scripts/prepare-windows-toolkit.ps1

      - name: Verify bundled Windows toolkit
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: ./scripts/verify-windows-toolkit.ps1

      - name: Build Tauri release
        shell: bash
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(
            find src-tauri/target -type f \( \
              -path '*/release/bundle/*' \
              -o -path '*/release/z3r-launcher' \
              -o -path '*/release/z3r-launcher.exe' \
            \)
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under src-tauri/target."
            exit 1
          fi
          gh release upload --repo "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
